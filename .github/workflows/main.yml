name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o WorldSoccerManager-Android-Project.zip -d project

      - name: Build APK
        working-directory: project/WorldSoccerManagerAndroid
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldSoccerManager-APK
          path: project/WorldSoccerManagerAndroid/app/build/outputs/apk/debug/app-debug.apk
